name: Windows installer

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ["**.md"]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pyinstaller -r requirements.txt

      - name: Build exe
        run: pyinstaller rig.spec --noconfirm --clean

      - name: Build installer
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" RIG.iss'

      - uses: actions/upload-artifact@v4
        with:
          name: RIG-Windows
          path: |
            dist/RIG.exe
            dist/RIG-Setup.exe
